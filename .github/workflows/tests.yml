# End-to-end and WCAG 2.2 AA tests in Chromium, Firefox and WebKit (Safari's engine).
# Hermetic: the app and test server run on localhost; every other request is answered by
# fictional fixtures in tests/run.py or blocked.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Build the React app and check the committed index.html matches it
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=low
          npm run build
          git diff --exit-code -- ../index.html ../server/csp.txt || { echo "::error::index.html is out of date: run 'cd app && npm run build' and commit it"; exit 1; }
      - name: Install axe-core (WCAG rules engine)
        run: npm install --no-save --no-package-lock axe-core@4.10.2
      - name: Install Playwright and ${{ matrix.browser }}
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        env:
          AXE_PATH: node_modules/axe-core/axe.min.js
        run: python tests/run.py --browser ${{ matrix.browser }}
