# Renders the 3D plates (collider teardown sequence, GO spheres, dial bezel) with Blender 4.2 LTS
# on a GitHub runner and commits them to assets/3d. Runs when blender/ changes, or on demand.
name: Render 3D plates
on:
  workflow_dispatch:
  push:
    paths: ["blender/**", ".github/workflows/render.yml"]
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.2 LTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libxkbcommon-x11-0 > /dev/null
          curl -fsSL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-4.2.3-linux-x64/blender --version
      - name: Render
        run: ./blender-4.2.3-linux-x64/blender -b --factory-startup -P blender/render_plates.py -- --out assets/3d --samples 48 --width 1280 --frames 9
      - name: Commit renders
        run: |
          ls -la assets/3d
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Render 3D plates (Blender 4.2 LTS, Cycles)" && git pull --rebase -q && git push; fi
