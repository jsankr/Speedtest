e my last test below for a check against your last result."],src:"Troubleshooting",go:[["Open Settings","sec:Settings"]]},{id:"slowdown",t:"My internet feels slow",k:"internet slow speed low bad poor sluggish buffering buffer streaming not working fast result what to do improve fix",a:["Work from the cheapest check outward: 1) test next to the router, 2) test on a cable, 3) try another server, 4) turn off any VPN or Private Relay, 5) restart the router and the ISP box. If a cable is fast and Wi-Fi is slow, the wireless link is the problem. If both are slow, contact your ISP with the History export as evidence.","Diagnose my last test below checks your result for the common causes."],src:"Troubleshooting",go:[["Open History","sec:History"]]},{id:"stuck100",t:"Speed stuck near 11-12 MB/s (about 93 Mbps)",k:"stuck capped 100 mbps 12 mb/s 11 93 slow fast ethernet cable port gigabit limit stuck plan faster",a:["That ceiling is the signature of a link that negotiated 100 Mbps instead of 1 Gbps. Usual causes are a loose or damaged cable, a 4-wire cable, or an old switch or port.","Reseat or replace the cable between the ISP box and the router (Cat5e or better), then check the router's WAN link speed."],src:"Troubleshooting",go:[]},{id:"wifislow",t:"Results far below my plan on Wi-Fi",k:"wifi wi-fi wireless slow below plan weak signal 2.4 5ghz distance interference router far",a:["Distance, the 2.4 GHz band and interference cost the most. Test next to the router on 5 GHz, then compare with a cable. If the cable is fast and Wi-Fi is slow, the problem is the wireless link, not your ISP."],src:"Troubleshooting",go:[]},{id:"pinghigh",t:"Ping is higher than usual, or lower than physically possible",k:"ping high latency vpn private relay icloud lag proxy lower impossible map minimum",a:["iCloud Private Relay or a VPN can route traffic elsewhere, which raises ping or makes it look too good for the map's physical minimum.","Turn Private Relay off for this network (Settings, Wi-Fi, the i next to the network) or disconnect the VPN, then retest."],src:"Troubleshooting",go:[["Check VPN / relay in My IP","tool:ip"]]},{id:"loaded",t:"Loaded ping and the A+ to F grade",k:"loaded ping bufferbloat grade responsiveness latency under load video call lag gaming grade a f",a:["Loaded ping is your latency while the line is busy. A big jump (bufferbloat) is what makes calls and games stutter while someone downloads, even when speed is fine. The grade comes from it.","The usual fix is Smart Queue Management (SQM, fq_codel or CAKE) or a bandwidth limit set to about 90% of your plan in the router's QoS settings."],src:"How the measurement works",go:[]},{id:"jitter",t:"What is jitter",k:"jitter variation ping stable consistency",a:["Jitter is how much your ping varies from one request to the next. Low and steady is better for calls and games; above about 30 ms is noticeable."],src:"How the measurement works",go:[]},{id:"method",t:"How the speed is measured",k:"how measured method accurate accuracy streams parallel ramp tcp average algorithm calculate precise trust",a:["Download uses several parallel HTTP streams (6 by default) and counts bytes as they arrive. Upload sends parallel POSTs sized to take about 0.6 s each. The final figure is the average after discarding the first 25% of the phase, while TCP is still ramping up.","Loaded ping is probed on a separate host (1.1.1.1) so the probe is not queued behind the test's own traffic."],src:"How the measurement works",go:[]},{id:"uploadfail",t:"Upload could not be measured",k:"upload failed error not measured missing couldn't confirm timeout no upload",a:["The server did not confirm uploads in time. Download and ping are still saved. Change server and retest."],src:"Troubleshooting",go:[["Open Settings","sec:Settings"]]},{id:"servers",t:"Choosing a test server",k:"server servers choose change select automatic cloudflare librespeed m-lab mlab ndt7 nearest closest region country",a:["Automatic picks the lowest ping. You can also choose Cloudflare (anycast), Measurement Lab (ndt7), any of 22 LibreSpeed volunteer servers, or your own server. Use Change server under Go; Measure ping to all compares them."],src:"What it does",go:[["Go to the test","tool:speed"]]},{id:"mlab",t:"Measurement Lab and my IP address",k:"m-lab mlab measurement lab publish public ip data open consent privacy ndt7",a:["M-Lab publishes every test as open data, including your IP address, date and time. CleanSpeed asks you to confirm that before running an M-Lab test."],src:"Privacy",go:[]},{id:"ownserver",t:"Run my own test server",k:"own server self host selfhost python lan local test home network https caddy nginx",a:["Run `python3 server/server.py --port 8080` (Python 3.9+, no logging) and open http://<server-ip>:8080/ to test your LAN or Wi-Fi without the internet in the way.","To use it from the hosted copy, via Change server, Your own server, it must be served over https, for example behind Caddy or nginx, because browsers block http requests from https pages."],src:"Self-host a test server",go:[]},{id:"privacy",t:"What leaves my device",k:"privacy data tracking track analytics cookies ads secure safe private collect send log store account sign up",a:["No accounts, ads, analytics, cookies or third-party scripts. Results, history, settings and location stay in this browser. The app contacts a service only when you use the feature that needs it, for example the test server you picked, 1.1.1.1 for loaded ping, NVD for the router check (brand and model only), or ipinfo and ipify for My IP & ISP.","Device lookup, the Wi-Fi password tool, the calculators and this help assistant send nothing."],src:"Privacy",go:[]},{id:"router",t:"Router security check",k:"router security check score vulnerabilities cve nvd firmware model brand scan safe settings admin wps upnp",a:["It scores your router settings from your answers, looks up known vulnerabilities for your model and firmware in the U.S. National Vulnerability Database, and gives step-by-step fixes, manufacturer-approved fixes only (no beta or third-party firmware).","Only the brand and model are sent to NVD, never your answers or firmware version. A browser cannot log in to your router, so the check relies on what you tell it."],src:"Router security",go:[["Open the router check","tool:router"]]},{id:"cantconfirm",t:"Router check says 'can't confirm'",k:"cant confirm can't confirm unknown affected unsure cve record version missing not sure router",a:["The public record for that issue lacks version data, so it cannot be matched to your firmware. Check the maker's own security advisory for your model."],src:"Limitations",go:[["Open the router check","tool:router"]]},{id:"lookupfail",t:"Router lookup failed",k:"lookup failed nvd rate limit unreachable error router vulnerabilities not loading",a:["NVD was unreachable or rate-limited. Wait a minute and retry. The settings score still works without it."],src:"Troubleshooting",go:[["Open the router check","tool:router"]]},{id:"collider",t:"The packet collider view",k:"collider 3d animation hadron lhc cms detector packets photon teardown blender particles bunches",a:["It draws the test as a particle collider modelled on CERN's CMS detector. A collision happens for each chunk of data really received, amber bunches leave for each chunk sent, and green probes run out and back for each ping. When the test ends the detector opens up with ping, download and upload on its parts.","The detector is rendered in Blender, with live data drawn on top through the same camera."],src:"Packet collider",go:[["Show the collider","sec:Packet collider"]]},{id:"animoff",t:"Turn animations off",k:"animation animate off stop disable motion reduce reduced battery performance cpu slow laggy stutter collider map",a:["Untick Animate on the collider and the map. If your system has Reduce motion turned on, animations start switched off and every state is still shown."],src:"Design system",go:[["Show the collider","sec:Packet collider"]]},{id:"map",t:"The live map",k:"map live route dots stylised position location where server cloudflare colo data centre telemetry timeline",a:["The map is stylised, not geographic. Each moving dot is real data counted as it arrives or leaves, slowed so the eye can follow. Your position comes from your time zone unless you allow precise location or run My IP & ISP, and it stays on this device. If a content blocker stops Cloudflare's reply, the map falls back to pulses around you."],src:"Live map",go:[["Show the map","sec:Live network map"]]},{id:"history",t:"History and CSV export",k:"history export csv save past results trend delete clear spreadsheet excel download label",a:["Every test is saved on this device with a trend chart. You can filter by network, edit a test's network label and export CSV. If Excel shows odd characters, import the file as UTF-8."],src:"History",go:[["Open History","sec:History"]]},{id:"nettype",t:"Network type is wrong",k:"network type wifi mobile ethernet wrong label cellular detect",a:["iPhone browsers do not expose the connection type. Pick Wi-Fi, Mobile or Ethernet under Go, and change past tests in History."],src:"Troubleshooting",go:[["Open History","sec:History"]]},{id:"install",t:"Install it like an app",k:"install app home screen add pwa iphone android desktop offline icon shortcut",a:["iPhone or iPad (Safari): Share, then Add to Home Screen. Android (Chrome): the menu, then Add to Home screen or Install app. Desktop Chrome or Edge: the install icon in the address bar."],src:"Install, use and self-host",go:[]},{id:"dns",t:"DNS benchmark",k:"dns benchmark fastest resolver cloudflare google quad9 adguard opendns change dns faster browsing",a:["It times Cloudflare, Google, Quad9, AdGuard and OpenDNS from your connection and recommends the fastest. To apply it everywhere, set it on the router (Internet or DHCP settings, DNS, Manual). Devices switch when they reconnect."],src:"Toolkit",go:[["Open DNS benchmark","tool:dns"]]},{id:"myip",t:"My IP & ISP, IPv6, VPN and relay check",k:"ip address isp ipv6 vpn relay private whats my ip provider asn location",a:["It shows your public IP, ISP and whether IPv6, a VPN or iCloud Private Relay is in play. ipinfo.io and ipify.org see your IP, like any website you visit."],src:"Toolkit",go:[["Open My IP & ISP","tool:ip"]]},{id:"mac",t:"Device lookup says 'Unknown maker'",k:"mac address device lookup unknown maker vendor oui private randomised randomized who made",a:["The address is probably private (randomised), or not in the IEEE registry. Check the device's Wi-Fi settings for Private address. Lookup uses the bundled oui.txt, so nothing is sent."],src:"Toolkit",go:[["Open Device lookup","tool:mac"]]},{id:"password",t:"Wi-Fi password tool",k:"wifi password generate strong strength test passphrase random secure",a:["It generates a strong random password and tests the strength of one you type. Everything is computed on this device and nothing is sent."],src:"Toolkit",go:[["Open Wi-Fi password","tool:pw"]]},{id:"subnet",t:"Subnet calculator and CGNAT",k:"subnet calculator cidr mask range cgnat ip ranges network prefix",a:["It shows the range, mask, usable hosts and flags CGNAT (100.64.0.0/10) ranges, which mean your ISP shares one public address between customers."],src:"Toolkit",go:[["Open Subnet calculator","tool:subnet"]]},{id:"calc",t:"Data and time calculator",k:"calculator data download time how long gb file size usage estimate monthly cap",a:["Enter a speed and a file size to get the download time, or the reverse. A test moves about your speed multiplied by the seconds in each phase, in each direction, so at 35 MB/s with 10-second phases expect roughly 350 MB down plus the upload."],src:"Toolkit",go:[["Open Data calculator","tool:calc"]]},{id:"pingmon",t:"Ping and outage monitor",k:"ping monitor outage drops packet loss uptime intermittent disconnect cuts latency over time",a:["It sends tiny requests to 1.1.1.1, google.com or your test server and records latency, loss and outages with start and end times. Useful evidence for an ISP when the connection drops."],src:"Toolkit",go:[["Open Ping monitor","tool:ping"]]},{id:"compare",t:"Global comparison",k:"compare global country world median ookla rank average where do i stand percentile",a:["Your result is compared with national and global medians from the Ookla Speedtest Global Index, for broadband or mobile. The data is a third-party compilation with a publication lag."],src:"Global comparison",go:[["Open comparison","tool:compare"]]},{id:"mobiledata",t:"Using less mobile data",k:"mobile data cellular usage lots gb cap save reduce limit seconds streams",a:["Lower Seconds per phase and the number of Parallel streams in Settings. A test moves roughly your speed times the phase length in each direction."],src:"Troubleshooting",go:[["Open Settings","sec:Settings"]]},{id:"fast",t:"Very high speeds (several Gbps)",k:"gbps multi gigabit fast 2.5g 10g cpu browser limit cannot reach high speed 5 gbps",a:["Above a few Gbps, the browser and device CPU can be the limit rather than the line. Wire the test device with a 2.5G or 10G port, close other tabs and try more parallel streams."],src:"Limitations",go:[["Open Settings","sec:Settings"]]},{id:"limits",t:"What a browser can't do",k:"limitation traceroute port scan wifi channel signal strength router login native not possible cant can't missing feature",a:["No traceroute, port scan, Wi-Fi channel scan or signal strength, and no router login. The router check relies on your answers plus public vulnerability data, and the map is stylised."],src:"Limitations",go:[]},{id:"theme",t:"Dark and light theme, accessibility",k:"theme dark light mode accessibility accessible keyboard screen reader contrast wcag font size reduce motion",a:["The app follows your system theme. It targets WCAG 2.2 AA: 4.5:1 text contrast, visible focus, 44 px touch targets, a skip link, and no sideways scroll at 320 px. Reduce motion i
